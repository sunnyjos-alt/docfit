<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="DocFit mark">
  <defs>
    <linearGradient id="dfMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0F3D5C"/>
    </linearGradient>
  </defs>

  <!-- Outer document frame -->
  <rect x="8" y="8" width="84" height="84" rx="20"
        fill="none" stroke="url(#dfMark)" stroke-width="7"/>

  <!-- Inner soft fill -->
  <rect x="20" y="20" width="60" height="60" rx="12"
        fill="url(#dfMark)" opacity="0.10"/>

  <!-- Resize corner brackets -->
  <path d="M14 26 V20 a10 10 0 0 1 10 -10 h6"
        fill="none" stroke="url(#dfMark)" stroke-width="7"
        stroke-linecap="round"/>
  <path d="M86 74 v6 a10 10 0 0 1 -10 10 h-6"
        fill="none" stroke="url(#dfMark)" stroke-width="7"
        stroke-linecap="round"/>

  <!-- Camera -->
  <rect x="26" y="36" width="30" height="22" rx="5" fill="url(#dfMark)"/>
  <rect x="35" y="32" width="12" height="6" rx="2" fill="url(#dfMark)"/>
  <circle cx="41" cy="47" r="7" fill="#FFFFFF"/>
  <circle cx="41" cy="47" r="3.5" fill="url(#dfMark)"/>
  <circle cx="51" cy="40" r="1.8" fill="#FFFFFF"/>

  <!-- Pen stroke -->
  <path d="M45 76 L70 51 L76 57 L51 82 Z" fill="url(#dfMark)"/>
  <path d="M45 76 L51 82 L42 84 Z" fill="#0F3D5C"/>

  <!-- Resize arrow -->
  <path d="M62 66 L84 88" stroke="url(#dfMark)" stroke-width="6"
        stroke-linecap="round"/>
  <path d="M84 88 h-11 M84 88 v-11"
        stroke="url(#dfMark)" stroke-width="6"
        stroke-linecap="round" fill="none"/>
</svg>